<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Made in Bayelsa</title>
<style>
:root{--g:#0f7a44;--gd:#0a5c33;--gl:#e6f4ec;--ink:#1a1d1b;--sub:#6b7570;--line:#e4e7e4}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#fff;max-width:520px;margin:0 auto;padding-bottom:80px}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.site-logo{height:64px;width:auto;display:block}
.flag{width:34px;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
h1{font-size:14px;line-height:1.1}h1 span{color:var(--g)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex}
nav button{flex:1;padding:14px 4px;border:0;background:none;font-size:12px;color:var(--sub)}
nav button.on{color:var(--g);font-weight:700}
main{padding:14px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--gl);display:block}
.card .i{padding:9px 10px}.n{font-size:12.5px;font-weight:600}.p{font-weight:800;margin:4px 0}
.badge{font-size:10px;font-weight:700;background:var(--gl);color:var(--gd);padding:2px 7px;border-radius:8px}
.badge.no{background:#f1f1f1;color:var(--sub)}
button.pri{background:var(--g);color:#fff;border:0;border-radius:22px;padding:11px 16px;font-weight:700;width:100%;margin-top:8px}
button.sec{background:#fff;color:var(--g);border:1.5px solid var(--g);border-radius:22px;padding:9px 14px;font-weight:700}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin:4px 0 10px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--sub);font-size:12px}h3{font-size:15px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:6px 0}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>

<script>

const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const STATES = ["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT (Abuja)","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];

const ship = s => ["Bayelsa","Rivers","Delta","Akwa Ibom","Cross River","Edo"].includes(s) ? 2000 : ["Lagos","Ogun","Ondo","Imo","Abia","Anambra","Enugu","Ebonyi"].includes(s) ? 3000 : 4500;

const $ = id => document.getElementById(id);
const cartCount = () => Object.values(S.cart).reduce((a,c)=>a+c.qty,0);

async function loadProducts(){
  const { data, error } = await sb.from('products')
    .select('id,name,price_ngn,image_url,category,businesses(name,verification_status)')
    .eq('is_active', true).order('created_at',{ascending:false});
  if(error) toast(error.message); S.products = data || [];
}
async function loadBiz(){
  if(!S.user){ S.biz=null; return; }
  const { data } = await sb.from('businesses').select('*').eq('owner_id', S.user.id).maybeSingle();
  S.biz = data;
}
async function refresh(){ await Promise.all([loadProducts(), loadBiz()]); render(); }

sb.auth.onAuthStateChange(async (_e, session) => {
  if(_e==='PASSWORD_RECOVERY'){ S.recovery=true; S.view='account'; }
  S.user = session?.user || null;
  if(S.user){ const { data } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle(); S.profile = data; }
  else S.profile = null;
  refresh();
});

/* ---------- views ---------- */
function shop(){
  if(!S.products.length) return '<p class="muted">No products yet. Products from verified Bayelsa businesses appear here.</p>';
  return '<div class="grid">' + S.products.map(p => `
    <div class="card"><img src="${esc(p.image_url||'')}" alt="">
      <div class="i"><span class="badge">${p.businesses?.verification_status==='verified'?'✓ Verified':'Unverified'}</span>
      <div class="n">${esc(p.name)}</div><div class="muted">${esc(p.businesses?.name||'')}</div>
      <div class="p">${money(p.price_ngn)}</div>
      <button class="sec" style="width:100%" onclick="addCart('${p.id}')">Add to cart</button></div></div>`).join('') + '</div>';
}
function addCart(id){ const p=S.products.find(x=>x.id===id); S.cart[id]={p,qty:(S.cart[id]?.qty||0)+1}; toast('Added to cart'); render(); }
function qty(id,d){ S.cart[id].qty+=d; if(S.cart[id].qty<=0) delete S.cart[id]; render(); }

function cart(){
  const items = Object.values(S.cart);
  if(!items.length) return '<p class="muted">Your cart is empty.</p>';
  const sub = items.reduce((a,c)=>a+c.p.price_ngn*c.qty,0), sh = ship(S.dState);
  return items.map(c=>`<div class="row"><div><div class="n">${esc(c.p.name)}</div><div class="muted">${money(c.p.price_ngn)}</div></div>
    <div><button class="sec" onclick="qty('${c.p.id}',-1)">−</button> ${c.qty} <button class="sec" onclick="qty('${c.p.id}',1)">+</button></div></div>`).join('') + `
    <div class="box" style="margin-top:12px"><h3>Delivery</h3>
      <select id="dState" onchange="S.dState=this.value;render()">${STATES.map(s=>`<option ${s===S.dState?'selected':''}>${s}</option>`).join('')}</select>
      <input id="dAddr" placeholder="Full delivery address"><input id="dPhone" placeholder="Phone number">
      <div class="row"><span>Subtotal</span><b>${money(sub)}</b></div><div class="row"><span>Shipping (${esc(S.dState)})</span><b>${money(sh)}</b></div>
      <div class="row"><span>Total</span><b>${money(sub+sh)}</b></div>
      <p class="muted">Payment: online payment isn't connected yet. After you place the order, the seller/admin confirms your payment and the status updates.</p>
      <button class="pri" onclick="checkout()">Place order</button></div>`;
}
async function checkout(){
  if(!S.user){ toast('Please sign in first'); return go('account'); }
  const addr=document.getElementById('dAddr').value.trim(), phone=document.getElementById('dPhone').value.trim();
  if(!addr||!phone) return toast('Enter address and phone');
  const items=Object.values(S.cart), sub=items.reduce((a,c)=>a+c.p.price_ngn*c.qty,0), sh=ship(S.dState);
  const { data:o, error } = await sb.from('orders').insert({customer_id:S.user.id,delivery_state:S.dState,delivery_address:addr,phone,subtotal_ngn:sub,shipping_ngn:sh,total_ngn:sub+sh}).select('id').single();
  if(error) return toast(error.message);
  const { data:prods } = await sb.from('products').select('id,business_id').in('id', items.map(c=>c.p.id));
  const bmap = Object.fromEntries((prods||[]).map(p=>[p.id,p.business_id]));
  const rows = items.map(c=>({order_id:o.id,product_id:c.p.id,business_id:bmap[c.p.id],qty:c.qty,unit_price_ngn:c.p.price_ngn}));
  const { error:e2 } = await sb.from('order_items').insert(rows);
  if(e2) return toast(e2.message);
  S.cart={}; toast('Order placed'); go('account');
}

async function account(){
  if(S.recovery) return `<div class="box"><h3>Set a new password</h3><input id="np" type="password" placeholder="New password (min 6 characters)"><button class="pri" onclick="setNewPw()">Save new password</button></div>`;
  if(!S.user) return `<div class="box"><h3>Sign in or create an account</h3>
    <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6)">
    <input id="fn" placeholder="Full name (for new accounts)">
    <button class="pri" onclick="signIn()">Sign in</button><button class="pri" style="background:#fff;color:var(--g);border:1.5px solid var(--g)" onclick="signUp()">Create account</button>
    <p style="text-align:center;margin-top:12px"><a href="#" onclick="forgot();return false" style="color:var(--g);font-size:13px;font-weight:600">Forgot password?</a></p></div>`;
  const { data:orders } = await sb.from('orders').select('*, order_items(id,qty,unit_price_ngn,product_id,products(name),reviews(id))').eq('customer_id',S.user.id).order('created_at',{ascending:false});
  let html = `<div class="box"><div class="row"><div><b>${esc(S.profile?.full_name||S.user.email)}</b><div class="muted">${esc(S.user.email)}</div></div><button class="sec" onclick="sb.auth.signOut()">Sign out</button></div></div><h3>My orders</h3>`;
  html += (orders||[]).map(o=>`<div class="box"><div class="row"><b>${money(o.total_ngn)}</b><span class="badge">${esc(o.status.replace('_',' '))}</span></div>
    <div class="muted">Payment: ${esc(o.payment_status.replace('_',' '))} · ${esc(o.delivery_state)}</div>
    ${(o.order_items||[]).map(i=>`<div class="row"><span>${esc(i.products?.name)} ×${i.qty}</span>${o.status==='delivered'&&!(i.reviews&&i.reviews.length)?`<button class="sec" onclick="review('${i.id}','${i.product_id}')">Rate</button>`:''}</div>`).join('')}</div>`).join('') || '<p class="muted">No orders yet.</p>';
  return html;
}
async function forgot(){
  const email=$('em').value.trim(); if(!email) return toast('Type your email above first, then tap Forgot password');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  toast(error?error.message:'If that email has an account, a reset link is on its way');
}
async function setNewPw(){
  const pw=$('np').value; if(pw.length<6) return toast('Password must be at least 6 characters');
  const {error}=await sb.auth.updateUser({password:pw});
  if(error) return toast(error.message); S.recovery=false; toast('Password updated'); render();
}
async function signIn(){ const {error}=await sb.auth.signInWithPassword({email:em.value,password:pw.value}); if(error) toast(error.message); }
async function signUp(){ const {error}=await sb.auth.signUp({email:em.value,password:pw.value,options:{data:{full_name:fn.value}}}); toast(error?error.message:'Account created — check your email if confirmation is on'); }
async function review(itemId,pid){
  const r=parseInt(prompt('Rating 1-5'),10); if(!(r>=1&&r<=5)) return;
  const c=prompt('Comment (optional)')||null;
  const {error}=await sb.from('reviews').insert({product_id:pid,order_item_id:itemId,customer_id:S.user.id,rating:r,comment:c});
  toast(error?error.message:'Thanks for your review'); render();
}

async function sell(){
  if(!S.user) return '<p class="muted">Sign in first (Account tab).</p>';
  if(!S.biz) return `<div class="box"><h3>Register your business</h3>
    <input id="bn" placeholder="Business name"><select id="bc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
    <input id="bl" placeholder="LGA (e.g. Yenagoa)"><input id="cac" placeholder="CAC number (optional)"></div>
    ${payoutForm(null)}<button class="pri" onclick="createBiz()">Register business</button>`;
  const b=S.biz;
  const { data:po } = await sb.from('business_payouts').select('*').eq('business_id',b.id).maybeSingle();
  if(!po || S.editPayout) return `<h3>${po?'Edit':'Add'} payout details</h3>${payoutForm(po)}<button class="pri" onclick="savePayout()">Save payout details</button>${po?'<button class="sec" style="width:100%;margin-top:8px" onclick="S.editPayout=false;render()">Cancel</button>':''}`;
  const { data:pays } = await sb.from('payouts').select('amount_ngn,status,reference,created_at').eq('business_id',b.id).order('created_at',{ascending:false});
  const { data:items } = await sb.from('order_items').select('id,qty,products(name),orders(id,status,payment_status,delivery_state,delivery_address,phone)').eq('business_id',b.id).order('id',{ascending:false});
  let html = `<div class="box"><b>${esc(b.name)}</b> <span class="badge ${b.verification_status==='verified'?'':'no'}">${esc(b.verification_status)}</span>
    ${b.verification_status==='unverified'||b.verification_status==='rejected'?`<button class="sec" style="margin-top:8px" onclick="reqVerify()">Request verification</button>`:''}
    <p class="muted">Products only appear to the public once an admin verifies your business.</p>
    <div class="row"><span class="muted">Payout account: ${esc(po.bank_name)} ••••${esc(po.account_number.slice(-4))}</span><button class="sec" onclick="S.editPayout=true;render()">Edit</button></div></div>
    <div class="box"><h3>My payouts</h3>${(pays||[]).map(x=>`<div class="row"><span>${money(x.amount_ngn)}</span><span class="badge ${x.status==='paid'?'':'no'}">${esc(x.status)}${x.reference?' · '+esc(x.reference):''}</span></div>`).join('')||'<p class="muted">Earnings appear here once a customer\'s payment is confirmed.</p>'}</div>
    <div class="box"><h3>List a product</h3>
    <img id="prev" src="${S.draftImg?URL.createObjectURL(S.draftImg):''}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--gl);${S.draftImg?'':'display:none'}">
    <input type="file" accept="image/*" onchange="pickImg(this)"><input id="pn" placeholder="Product name"><select id="pc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
    <input id="pp" type="number" placeholder="Price (₦)"><textarea id="pd" placeholder="Short description"></textarea>
    <button class="pri" onclick="addProduct()">Publish product</button></div><h3>Orders for my products</h3>`;
  html += (items||[]).map(i=>`<div class="box"><div class="row"><b>${esc(i.products?.name)} ×${i.qty}</b><span class="badge">${esc(i.orders.payment_status.replace('_',' '))}</span></div>
    <div class="muted">${esc(i.orders.delivery_address)}, ${esc(i.orders.delivery_state)} · ${esc(i.orders.phone)}</div>
    <select onchange="setStatus('${i.orders.id}',this.value)">${['received','processing','dispatched','in_transit','delivered','cancelled'].map(s=>`<option value="${s}" ${s===i.orders.status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></div>`).join('') || '<p class="muted">No orders yet.</p>';
  return html;
}
function readPayout(){
  const v={contact_name:$('poName').value.trim(),contact_email:$('poEmail').value.trim(),contact_phone:$('poPhone').value.trim(),
    bank_name:$('poBank').value.trim(),account_number:$('poAcct').value.trim(),account_name:$('poAcctName').value.trim()};
  if(Object.values(v).some(x=>!x)) { toast('Please fill in every payout field'); return null; }
  if(!/^[0-9]{10}$/.test(v.account_number)) { toast('Account number must be 10 digits'); return null; }
  return v;
}
function payoutForm(p){
  p=p||{}; const val=k=>esc(p[k]||'');
  return `<div class="box"><h3>Payout details</h3>
    <p class="muted">When a customer's payment is confirmed, your earnings for that item are sent to this account. Only you and the platform admin can see it.</p>
    <input id="poName" placeholder="Your full name" value="${val('contact_name')}">
    <input id="poEmail" type="email" placeholder="Email" value="${esc(p.contact_email||S.user?.email||'')}">
    <input id="poPhone" placeholder="Phone number" value="${val('contact_phone')}">
    <input id="poBank" placeholder="Bank name (e.g. OPay, GTBank)" value="${val('bank_name')}">
    <input id="poAcct" inputmode="numeric" maxlength="10" placeholder="10-digit account number" value="${val('account_number')}">
    <input id="poAcctName" placeholder="Account name" value="${val('account_name')}"></div>`;
}
async function createBiz(){
  const po=readPayout(); if(!po) return;
  if(!$('bn').value.trim()) return toast('Enter your business name');
  const {data:b,error}=await sb.from('businesses').insert({owner_id:S.user.id,name:$('bn').value.trim(),category:$('bc').value,lga:$('bl').value,phone:po.contact_phone,cac_number:$('cac').value||null}).select().single();
  if(error) return toast(error.message);
  const {error:e2}=await sb.from('business_payouts').insert({business_id:b.id,...po});
  if(e2) return toast(e2.message);
  await loadBiz(); toast('Business registered'); render();
}
async function savePayout(){
  const po=readPayout(); if(!po) return;
  const {error}=await sb.from('business_payouts').upsert({business_id:S.biz.id,...po,updated_at:new Date().toISOString()});
  toast(error?error.message:'Payout details saved'); S.editPayout=false; render();
}
async function reqVerify(){ const {error}=await sb.from('businesses').update({verification_status:'pending'}).eq('id',S.biz.id); toast(error?error.message:'Verification requested'); await loadBiz(); render(); }
function pickImg(input){ S.draftImg=input.files[0]||null; render(); }
function resize(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=800; const s=Math.min(img.width,img.height); c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,800,800); c.toBlob(res,'image/jpeg',0.85); }; img.src=URL.createObjectURL(file); }); }
async function addProduct(){
  if(!S.draftImg) return toast('Choose a photo first');
  const price=parseInt(pp.value,10); if(!pn.value.trim()||!(price>0)) return toast('Enter name and price');
  const blob=await resize(S.draftImg), path=`${S.user.id}/${Date.now()}.jpg`;
  const up=await sb.storage.from('product-photos').upload(path,blob,{contentType:'image/jpeg'});
  if(up.error) return toast(up.error.message);
  const url=sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl;
  const {error}=await sb.from('products').insert({business_id:S.biz.id,name:pn.value.trim(),description:pd.value,category:pc.value,price_ngn:price,image_url:url});
  if(error) return toast(error.message);
  S.draftImg=null; toast('Product listed'); await loadProducts(); render();
}
async function setStatus(oid,st){ const {error}=await sb.from('orders').update({status:st}).eq('id',oid); toast(error?error.message:'Status updated'); }

async function admin(){
  if(S.profile?.role!=='admin') return '<p class="muted">Admins only.</p>';
  const { data:m } = await sb.rpc('pilot_metrics');
  const { data:pend } = await sb.from('businesses').select('id,name,cac_number,verification_status').in('verification_status',['pending','unverified']);
  const { data:unpaid } = await sb.from('orders').select('id,total_ngn,delivery_state').eq('payment_status','awaiting_payment').neq('status','cancelled');
  const { data:due } = await sb.from('payouts').select('id,amount_ngn,business_id,businesses(name)').eq('status','due').order('created_at');
  const ids=[...new Set((due||[]).map(d=>d.business_id))];
  const { data:accts } = ids.length ? await sb.from('business_payouts').select('*').in('business_id',ids) : {data:[]};
  const am=Object.fromEntries((accts||[]).map(a=>[a.business_id,a]));
  return `<div class="box"><h3>Pilot metrics (real activity)</h3>${Object.entries(m||{}).map(([k,v])=>`<div class="row"><span class="muted">${esc(k.replace(/_/g,' '))}</span><b>${esc(v ?? '—')}</b></div>`).join('')}</div>
   <h3>Businesses awaiting verification</h3>${(pend||[]).map(b=>`<div class="box"><b>${esc(b.name)}</b><div class="muted">CAC: ${esc(b.cac_number||'none')} · ${esc(b.verification_status)}</div>
   <button class="sec" onclick="setVerify('${b.id}','verified')">Verify</button> <button class="sec" onclick="setVerify('${b.id}','rejected')">Reject</button></div>`).join('')||'<p class="muted">None.</p>'}
   <h3>Payouts to send</h3>${(due||[]).map(d=>{const a=am[d.business_id]||{};return `<div class="box"><div class="row"><b>${money(d.amount_ngn)}</b><span class="muted">${esc(d.businesses?.name)}</span></div>
     <div class="muted">${esc(a.account_name)} · ${esc(a.bank_name)} · <b>${esc(a.account_number)}</b><br>${esc(a.contact_phone)} · ${esc(a.contact_email)}</div>
     <button class="sec" style="margin-top:8px" onclick="markPaid('${d.id}')">Mark as paid</button></div>`}).join('')||'<p class="muted">None due.</p>'}
   <h3>Orders awaiting payment confirmation</h3>${(unpaid||[]).map(o=>`<div class="box row"><span>${money(o.total_ngn)} · ${esc(o.delivery_state)}</span><button class="sec" onclick="confirmPay('${o.id}')">Confirm payment received</button></div>`).join('')||'<p class="muted">None.</p>'}`;
}
async function markPaid(id){ const ref=prompt('Transfer reference (optional)')||null; const {error}=await sb.from('payouts').update({status:'paid',reference:ref}).eq('id',id); toast(error?error.message:'Marked as paid'); render(); }
async function setVerify(id,v){ const {error}=await sb.from('businesses').update({verification_status:v}).eq('id',id); toast(error?error.message:'Updated'); render(); }
async function confirmPay(id){ const {error}=await sb.from('orders').update({payment_status:'payment_confirmed'}).eq('id',id); toast(error?error.message:'Payment confirmed'); render(); }

async function render(){
  const tabs=[['shop','Shop'],['cart',`Cart (${cartCount()})`],['sell','Sell'],['account','Account']];
  if(S.profile?.role==='admin') tabs.push(['admin','Admin']);
  document.getElementById('nav').innerHTML = tabs.map(([k,l])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const m=document.getElementById('main'), v=S.view;
  m.innerHTML = v==='shop'?shop(): v==='cart'?cart(): '<p class="muted">Loading…</p>';
  if(v==='account') m.innerHTML = await account();
  if(v==='sell') m.innerHTML = await sell();
  if(v==='admin') m.innerHTML = await admin();
}
refresh();
</script>
</body>
</html>
